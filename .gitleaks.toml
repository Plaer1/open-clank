title = "Open Clank secret-scanning exceptions"

[extend]
useDefault = true

# Frozen translation catalogs contain UI message identifiers, never key values.
# Match only their exact field and namespace shape; translated API labels in
# historical commits are classified by immutable fingerprints instead.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Frozen translation UI identifiers"
condition = "AND"
regexTarget = "line"
paths = ['(^|/)static/i18n/(freeze/(context|strings|batches/batch-[0-9]{3})|ledger|provenance)\.json$']
regexes = ['^\s*"key":\s*"ui(\.[A-Za-z0-9_-]+)+",?\s*$']

# Exact synthetic idempotency values in the affected operation tests. The
# secret-value constraint does not exempt a new key on the same source line.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Synthetic operation identifiers"
condition = "AND"
regexTarget = "secret"
paths = ['(^|/)tests/test_(managed_protocol|managed_operation_router|stats_quota_adapters|search_contract_s01|stats_s01_foundation|operation_artifacts|tui_turn_routes)\.py$']
regexes = ['^(operation-id-123456|cancel-operation-0001|operation-key-0001|bob-operation-key-1|idempotency-key-1|turn-idempotency-000[12])$']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Keyboard shortcut strings in command declarations"
condition = "AND"
regexTarget = "line"
paths = ['(^|/)packages/mimo-code/packages/app/src/pages/layout\.tsx$']
regexes = ['^\s*keybind: "shift\+alt\+arrow(up|down)",\s*$']

[[allowlists]]
targetRules = ["private-key"]
description = "Deliberately incomplete PEM header used by the no-store test"
condition = "AND"
regexTarget = "line"
paths = ['(^|/)mcp_servers/frankenmemory/crates/fm-core/src/privacy\.rs$']
regexes = ['(?m)^\s*"-----BEGIN PRIVATE KEY-----\\nabc",\s*$']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Exact fake credentials in redaction behavior tests"
condition = "AND"
regexTarget = "secret"
paths = ['(^|/)packages/mimo-code/packages/opencode/test/tool/bash_token_efficient_pipeline\.test\.ts$']
regexes = ['^(eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjMifQ\.dBjftJeZ4CVPmB92Sg|0123456789abcdef)$']

# Exact upstream test publishable client identifier; public by design.
# Different values and private sk_ keys still trigger scanning.
[[allowlists]]
targetRules = ["generic-api-key"]
description = "Upstream Stripe test publishable client identifier"
condition = "AND"
regexTarget = "secret"
paths = ['(^|/)packages/mimo-code/packages/console/app/package\.json$']
regexes = ['^pk_test_51RtuLNE7fOCwHSD4mewwzFejyytjdGoSDK7CAvhbffwaZnPbNb2rwJICw6LTOXCmWO320fSNXvb5NzI08RZVkAxd00syfqrW7t$']

[[allowlists]]
targetRules = ["generic-api-key"]
description = "Exact existing translated UI labels"
condition = "AND"
regexTarget = "line"
paths = ["(^|/)static/i18n/ar\\.json$"]
regexes = ["(?m)^\\s*\"ui\\.api\\.key\":\\ \"\u0645\u0641\u062a\u0627\u062d\\ API\",\\s*$"]

