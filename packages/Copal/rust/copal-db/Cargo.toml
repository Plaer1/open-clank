[package]
name = "copal-db"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "copal_db"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
blake3 = "1"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
sha2 = "0.10"
unicase = "2"
unicode-normalization = "0.1"
ulid = "1"
