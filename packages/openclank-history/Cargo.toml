[package]
name = "openclank-history"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1.11.1"
base64 = "0.22.1"
blake3 = "1.8.2"
libc = "0.2"
sha2 = "0.10"
lore-storage = { path = "vendor/lore/lore-storage" }
redb = "2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "fs", "net", "io-util", "time"] }

[features]
test_faults = []
qualification-fixtures = ["test_faults", "lore-storage/test_faults"]

[dev-dependencies]
tempfile = "3.27.0"
lore-storage = { path = "vendor/lore/lore-storage", features = ["test_faults"] }

[[bin]]
name = "lore_fixture"
path = "src/bin/lore_fixture.rs"
required-features = ["qualification-fixtures"]

[[bin]]
name = "openclank-history-service"
path = "src/bin/openclank-history-service.rs"

[workspace]
resolver = "2"
members = [
    ".",
    "vendor/lore/lore-base",
    "vendor/lore/lore-credential",
    "vendor/lore/lore-error-set",
    "vendor/lore/lore-error-set-macro",
    "vendor/lore/lore-io",
    "vendor/lore/lore-proto",
    "vendor/lore/lore-storage",
    "vendor/lore/lore-telemetry",
    "vendor/lore/lore-transport",
]

[workspace.package]
version = "0.9.1-nightly"

[workspace.dependencies]
