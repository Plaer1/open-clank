# Note: we currently control debug symbol splitting in .cargo/config.toml

# Unoptimized builds, and the `test` profile that inherits from this one. Every
# test target links the whole workspace, so full DWARF is copied into each of
# them: it dominates link time, the size of the target directory and the
# linker's peak memory. Line tables keep file and line in a backtrace, which is
# what a failing test reports, and drop the type and variable information a
# debugger would use.
[profile.dev]
debug = "line-tables-only"

# Fast build suitable for local development
[profile.release]
debug = "line-tables-only"
incremental = true
debug-assertions = true
panic = "abort"

# Faster to build than the `release` profile, for rapid iteration when debugging
[profile.iteration]
inherits = "release"
lto = "off"

# The actual release build
[profile.release-lto]
inherits = "release"
incremental = false
opt-level = 3
debug = 2
lto = "fat"
codegen-units = 4
debug-assertions = false

# Package overrides. Use this if you want to generate debug info or de-optimise a specific package
#[profile.release.package.lore-revision]
#debug = 2
#opt-level = 0

# Quinn sometimes debug asserts on something, silence it for now until we can investigate
[profile.release.package.quinn]
debug-assertions = false

[patch.crates-io]
quinn-proto = { path = "vendor/lore/vendor/quinn-proto" }
# Fixes a `**` backtracking defect that made the filter silently under-exclude;
# see vendor/glob-match/Cargo.toml.
glob-match = { path = "vendor/lore/vendor/glob-match" }
