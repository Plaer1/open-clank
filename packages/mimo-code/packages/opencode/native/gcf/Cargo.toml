[package]
name = "openclank-gcf"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
default = []
node-addon = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
napi = { version = "=3.16.0", default-features = false, features = ["napi6", "dyn-symbols"], optional = true }
napi-derive = { version = "=3.7.0", optional = true }

[build-dependencies]
napi-build = { version = "=2.6.0", optional = true }

[profile.release]
panic = "unwind"
