 stroke-width="2" stroke-dasharray="5 5"/><circle cx="178" cy="407" r="3" fill="#c7c3be"/><circle cx="456" cy="407" r="3" fill="#c7c3be"/><circle cx="734" cy="407" r="3" fill="#c7c3be"/><circle cx="1017" cy="407" r="3" fill="#c7c3be"/><path class="wire" data-ends="files copal" d="M178 557V614" fill="none" stroke="#778d70" stroke-width="2" stroke-dasharray=""/><path class="wire" data-ends="memory graph" d="M456 557V614" fill="none" stroke="#778d70" stroke-width="2" stroke-dasharray=""/><g class="node" id="host" role="button" tabindex="0" aria-label="Workspace host" style="--accent:#f6be48"><title>Odysseus supplies the self-hosted web application foundation. Open Clank extends its FastAPI process, authenticates requests and keeps the visible chat session and applets together.</title><rect class="card" x="54" y="216" width="310" height="107" rx="8"/><circle cx="70" cy="234" r="3" fill="#f6be48"/><text x="81" y="237" class="tag" style="fill:#f6be48">ODYSSEUS  /  INHERITED</text><text x="70" y="269" class="name">Workspace host</text><text x="70" y="292" class="body">FastAPI · accounts · sessions</text><text x="70" y="309" class="body">Chat, research and app routes</text></g><g class="node" id="bridge" role="button" tabindex="0" aria-label="Turn gateway" style="--accent:#ed83bb"><title>The host builds the turn envelope. Its default ACP supervisor adapter talks to the embedded engine and projects responses and tool activity back into the chat. ACP means Agent Client Protocol.</title><rect class="card" x="444" y="216" width="310" height="107" rx="8"/><circle cx="460" cy="234" r="3" fill="#ed83bb"/><text x="471" y="237" class="tag" style="fill:#ed83bb">OPEN CLANK  /  ADAPTER</text><text x="460" y="269" class="name">Turn gateway</text><text x="460" y="292" class="body">Scopes tools and model routes</text><text x="460" y="309" class="body">Streams replies back to chat</text></g><g class="node" id="engine" role="button" tabindex="0" aria-label="Agent engine" style="--accent:#70cde4"><title>The MiMo Code fork contributes its TypeScript engine, built on opencode. Open Clank uses it headlessly. The fork also contains desktop and console packages, while the workspace UI comes from the host.</title><rect class="card" x="836" y="216" width="310" height="107" rx="8"/><circle cx="852" cy="234" r="3" fill="#70cde4"/><text x="863" y="237" class="tag" style="fill:#70cde4">MIMO CODE  /  INHERITED</text><text x="852" y="269" class="name">Agent engine</text><text x="852" y="292" class="body">ACP sessions · model providers</text><text x="852" y="309" class="body">Streaming and tool dispatch</text></g><g class="node" id="files" role="button" tabindex="0" aria-label="Scoped Files" style="--accent:#b3da79"><title>The Files façade exposes allowed resources to the workspace. On strict agent turns the host enables scoped adapters and denies native file-tool aliases to keep one authority for access.</title><rect class="card" x="54" y="450" width="247" height="107" rx="8"/><circle cx="70" cy="468" r="3" fill="#b3da79"/><text x="81" y="471" class="tag" style="fill:#b3da79">RUST  /  FILE SERVICE</text><text x="70" y="503" class="name">Scoped Files</text><text x="70" y="526" class="body">Authorized resource handles</text><text x="70" y="543" class="body">Filesystem operations</text></g><g class="node" id="memory" role="button" tabindex="0" aria-label="Memery" style="--accent:#b3da79"><title>A host-owned worker runs Memery over a private pipe. The server supplies owner scope and policy. Its Rust core holds memory records and code indexes used by search and graph views.</title><rect class="card" x="332" y="450" width="247" height="107" rx="8"/><circle cx="348" cy="468" r="3" fill="#b3da79"/><text x="359" y="471" class="tag" style="fill:#b3da79">RUST  /  PRIVATE WORKER</text><text x="348" y="503" class="name">Memery</text><text x="348" y="526" class="body">Recall · approved knowledge</text><text x="348" y="543" class="body">Semantic and code indexes</text></g><g class="node" id="history" role="button" tabindex="0" aria-label="File History" style="--accent:#b3da79"><title>Open Clank integrates the Lore library for application history. File versions and restore actions use this adapter. Repository Git operations have their own workbench.</title><rect class="card" x="610" y="450" width="247" height="107" rx="8"/><circle cx="626" cy="468" r="3" fill="#b3da79"/><text x="637" y="471" class="tag" style="fill:#b3da79">RUST  /  LORE ADAPTER</text><text x="626" y="503" class="name">File History</text><text x="626" y="526" class="body">Versioned checkpoints</text><text x="626" y="543" class="body">Compare and restore</text></g><g class="node" id="super" role="button" tabindex="0" aria-label="Agent supervisor" style="--accent:#b5a5e5"><title>This alternate backend needs both the rust backend selection and its enable flag, plus a private socket and session binding. The factory defaults to ACP.</title><rect class="card" x="888" y="450" width="258" height="107" rx="8"/><circle cx="904" cy="468" r="3" fill="#b5a5e5"/><text x="915" y="471" class="tag" style="fill:#b5a5e5">RUST  /  OPT-IN</text><text x="904" y="503" class="name">Agent supervisor</text><text x="904" y="526" class="body">Process and session control</text><text x="904" y="543" class="body">Explicit activation required</text></g><g class="node" id="copal" role="button" tabindex="0" aria-label="Copal + Editor" style="--accent:#ed83bb"><title>Copal brings journal pages and linked knowledge into the same workspace as the source editor. Files is the directory view. Wiki and image editing are modes of Editor.</title><rect class="card" x="54" y="660" width="247" height="107" rx="8"/><circle cx="70" cy="678" r="3" fill="#ed83bb"/><text x="81" y="681" class="tag" style="fill:#ed83bb">AUTHORING</text><text x="70" y="713" class="name">Copal + Editor</text><text x="70" y="736" class="body">Journal · Wiki · backlinks</text><text x="70" y="753" class="body">Source, Markdown and images</text></g><g class="node" id="graph" role="button" tabindex="0" aria-label="Graph" style="--accent:#ed83bb"><title>Graph exposes different relationship sets. Journal links connect pages and files. The code projection turns indexed source into navigable symbols and typed relationships.</title><rect class="card" x="332" y="660" width="247" height="107" rx="8"/><circle cx="348" cy="678" r="3" fill="#ed83bb"/><text x="359" y="681" class="tag" style="fill:#ed83bb">EXPLORATION</text><text x="348" y="713" class="name">Graph</text><text x="348" y="736" class="body">Journal and workspace links</text><text x="348" y="753" class="body">Code symbols and calls</text></g><g class="node" id="learn" role="button" tabindex="0" aria-label="TreeHouse" style="--accent:#ed83bb"><title>The pre-alpha learning suite connects lesson content, prerequisites and practice inside the workspace. Tasks, Calendar and Timeline sit alongside it for planning and review.</title><rect class="card" x="610" y="660" width="247" height="107" rx="8"/><circle cx="626" cy="678" r="3" fill="#ed83bb"/><text x="637" y="681" class="tag" style="fill:#ed83bb">LEARNING</text><text x="626" y="713" class="name">TreeHouse</text><text x="626" y="736" class="body">Lessons and practice</text><text x="626" y="753" class="body">Linked learning material</text></g><g class="node" id="activity" role="button" tabindex="0" aria-label="Buddy + Clankshop" style="--accent:#ed83bb"><title>Buddy explains the workspace element you select. Clankshop turns agent activity into animated scenes and procedural audio. Model Comparison is another host surface for inspecting agent work.</title><rect class="card" x="888" y="660" width="258" height="107" rx="8"/><circle cx="904" cy="678" r="3" fill="#ed83bb"/><text x="915" y="681" class="tag" style="fill:#ed83bb">AGENT ACTIVITY</text><text x="904" y="713" class="name">Buddy + Clankshop</text><text x="904" y="736" class="body">Point at a control for help</text><text x="904" y="753" class="body">Watch tools
