name: Beta release Windows builds

on:
  push:
    branches: [codex/beta1-release-build-20261006]
  workflow_dispatch:
    inputs:
      emoji_release_tag:
        description: Same-repository release containing the pinned shared offline artwork parts
        required: true
        default: v1.0.2-beta.1-artwork-compact
        type: string

permissions:
  contents: read

concurrency:
  group: beta-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.ref == 'refs/heads/codex/beta1-release-build-20261006'
    name: Native ${{ matrix.target }} portable qualification
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            architecture: x64
            rust_host: x86_64-pc-windows-msvc
            bun_archive: bun-windows-x64
            bun_sha256: e6f093d39da486b20262ca8cdd5ed6a9e8bc9c2f275b78e6d3a0c5b28cc95901
          - target: windows-arm64
            runner: windows-11-arm
            architecture: arm64
            rust_host: aarch64-pc-windows-msvc
            bun_archive: bun-windows-aarch64
            bun_sha256: f473bfe2df73ee770548c93dd5d380aea7120c218ec2aa1afdd0bbba7bf18c47
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: 1.99.0-${{ matrix.rust_host }}
      RELEASE_TARGET: ${{ matrix.target }}
      NATIVE_ARCH: ${{ matrix.architecture }}
      EMOJI_RELEASE_TAG: ${{ inputs.emoji_release_tag || 'v1.0.2-beta.1-artwork-compact' }}
    steps:
      - name: Preserve real vendored symlinks before checkout
        run: |
          git config --global core.symlinks true
          if ($LASTEXITCODE -ne 0) { throw 'Runner cannot enable the source symlink checkout contract.' }
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check shared release access before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:EMOJI_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Shared release assets are unavailable to the read-only repository token. Do not substitute a personal token or broader job permissions.' }
          $parts = Join-Path $env:RUNNER_TEMP 'emoji-parts'
          gh release download $env:EMOJI_RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern 'bundle-manifest.json' --pattern 'emoji-assets.parts.json' --pattern 'emoji-assets.pack.part-001' --dir $parts
          if ($LASTEXITCODE -ne 0) { throw 'Compact public files are unavailable.' }
          $sealedPath = 'static/vendor/google-emoji/bundle-manifest.json'
          if ((Get-FileHash $sealedPath -Algorithm SHA256).Hash.ToLower() -ne '03bfa768ea11381d9859464bd05f848f4709f848085537b10029abe9e64fd385' -or (Get-FileHash (Join-Path $parts 'bundle-manifest.json') -Algorithm SHA256).Hash.ToLower() -ne '03bfa768ea11381d9859464bd05f848f4709f848085537b10029abe9e64fd385' -or (Get-FileHash (Join-Path $parts 'emoji-assets.parts.json') -Algorithm SHA256).Hash.ToLower() -ne 'f58411bc3aee12c7947ef27271f86cde9e4813df230c97d6394c1a715acdb2f9') { throw 'Public manifest hashes disagree with sealed source pins.' }
          $sealed = Get-Content $sealedPath -Raw | ConvertFrom-Json
          $manifest = Get-Content (Join-Path $parts 'emoji-assets.parts.json') -Raw | ConvertFrom-Json
          if ($manifest.pack_bytes -ne $sealed.pack_bytes -or $manifest.pack_sha256 -ne $sealed.pack_sha256 -or @($manifest.parts).Count -ne 1) { throw 'Compact part identity disagrees with sealed source pin.' }
          $part = $manifest.parts[0]
          if ($part.filename -ne 'emoji-assets.pack.part-001' -or $part.bytes -ne $sealed.pack_bytes -or $part.sha256 -ne $sealed.pack_sha256) { throw 'Require the exact sole compact part.' }
          $payload = Join-Path $parts $part.filename
          if ((Get-Item $payload).Length -ne $part.bytes -or (Get-FileHash $payload -Algorithm SHA256).Hash.ToLower() -ne $part.sha256) { throw 'Compact part bytes/hash refused before native build.' }
          Write-Output 'Compact artwork: exact three public files admitted against sealed source pins'
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.16'
          architecture: ${{ matrix.architecture }}
      - name: Inspect actual vendored links with standard library only
        run: |
          @'
          import os
          import subprocess
          from pathlib import Path
          raw = subprocess.check_output(['git', 'ls-files', '-s', '-z', '--', 'packages/mimo-code'])
          links = []
          mismatches = []
          for record in raw.split(b'\0'):
              if record and record.startswith(b'120000 '):
                  metadata, name = record.split(b'\t', 1)
                  path = Path(name.decode('utf-8'))
                  links.append(path)
                  if path.is_symlink():
                      expected = subprocess.check_output(['git', 'cat-file', 'blob', metadata.split()[1].decode('ascii')]).decode('utf-8')
                      actual = os.readlink(path)
                      if actual != expected:
                          mismatches.append((path.as_posix(), expected, actual))
          actual_count = sum(path.is_symlink() for path in links)
          print(f'Engine checkout symlinks: tracked={len(links)}, actual={actual_count}, plain_or_missing={len(links)-actual_count}, literal_target_mismatches={len(mismatches)}')
          for path, expected, actual in mismatches[:3]:
              print(f'Git link {path[:160]!r}: blob_target={expected[:200]!r}, actual_readlink={actual[:200]!r}')
          if actual_count != len(links):
              raise SystemExit('Engine checkout must retain actual Git symlinks; no text-file substitution')
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Native checkout source-type diagnostic failed.' }
      - name: Bootstrap only native Engine contract imports
        run: |
          $specs = @(Get-Content requirements.txt | Where-Object { $_ -match '^pydantic(?=[<>=!~;\s]|$)' })
          if ($specs.Count -ne 1) { throw 'Require exactly one canonical Pydantic requirement for the contract bootstrap.' }
          $contractSpec = $specs[0].Trim()
          python -m pip install --disable-pip-version-check --only-binary=:all: $contractSpec
          if ($LASTEXITCODE -ne 0) { throw 'Minimal native binary-wheel Engine contract bootstrap failed; no source or emulated fallback.' }
      - name: Validate exact Engine contract before expensive builds
        run: |
          python -B -c "from pathlib import Path; from src.openclank.engine_build import source_fingerprint; print('Engine checkout SHA256: ' + source_fingerprint(Path('packages/mimo-code')))"
          if ($LASTEXITCODE -ne 0) { throw 'Canonical Engine fingerprint diagnostic import failed after the minimal bootstrap.' }
          python -B scripts/openclank_engine.py contract --json
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Engine source contract failed before dependency/native builds; do not repin or bypass.' }
      - name: Initialize native MSVC and LLVM
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = (& $vswhere -latest -products '*' -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Native Visual Studio installation is missing.' }
          $devcmd = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          $command = '"' + $devcmd + '" -no_logo -arch=' + $env:NATIVE_ARCH + ' -host_arch=' + $env:NATIVE_ARCH + ' && set'
          $priorEnvironment = @{}
          Get-ChildItem Env: | ForEach-Object { $priorEnvironment[$_.Name] = $_.Value }
          $lines = & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Native MSVC environment initialization failed.' }
          foreach ($line in $lines) {
            $index = $line.IndexOf('=')
            if ($index -gt 0) {
              $name = $line.Substring(0, $index); $value = $line.Substring($index + 1)
              [Environment]::SetEnvironmentVariable($name, $value, 'Process')
              if ($priorEnvironment[$name] -cne $value -and $name -notmatch '^(GITHUB_|RUNNER_|ACTIONS_)') { Add-Content -Path $env:GITHUB_ENV -Value "$name=$value" }
            }
          }
          if ($env:VSCMD_ARG_TGT_ARCH -ne $env:NATIVE_ARCH -or $env:VSCMD_ARG_HOST_ARCH -ne $env:NATIVE_ARCH) { throw 'MSVC host/target architecture mismatch.' }
          $llvm = Join-Path $env:ProgramFiles 'LLVM/bin'
          if (-not (Test-Path (Join-Path $llvm 'libclang.dll'))) { throw 'Native LLVM/libclang is missing.' }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$llvm"
          Add-Content -Path $env:GITHUB_PATH -Value $llvm
      - name: Install exact native Rust and Bun
        env:
          BUN_ARCHIVE: ${{ matrix.bun_archive }}
          BUN_SHA256: ${{ matrix.bun_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Rust toolchain installation failed.' }
          $rust = (& rustc -vV | Out-String)
          if ($LASTEXITCODE -ne 0 -or $rust -notmatch 'release: 1[.]99[.]0' -or $rust -notmatch [regex]::Escape('host: ${{ matrix.rust_host }}')) { throw 'Rust version/native host mismatch.' }
          $zip = Join-Path $env:RUNNER_TEMP 'bun.zip'
          Invoke-WebRequest "https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/$env:BUN_ARCHIVE.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:BUN_SHA256) { throw 'Pinned Bun archive hash mismatch.' }
          $root = Join-Path $env:RUNNER_TEMP 'bun-native'
          Expand-Archive $zip -DestinationPath $root
          Remove-Item $zip
          $bin = Join-Path $root $env:BUN_ARCHIVE
          $bun = Join-Path $bin 'bun.exe'
          if ((& $bun --version | Out-String).Trim() -ne '1.4.0') { throw 'Pinned Bun version mismatch.' }
          if ((& $bun -e 'console.log(process.arch)' | Out-String).Trim() -ne $env:NATIVE_ARCH) { throw 'Bun native architecture mismatch.' }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Install complete native Python dependencies
        run: |
          $python = (Get-Command python).Source
          & $python -B scripts/windows_native_dependencies.py --target $env:RELEASE_TARGET --work-root (Join-Path $env:RUNNER_TEMP 'wdeps')
          if ($LASTEXITCODE -ne 0) { throw 'Complete native dependency preparation failed; no reduced-feature or emulated fallback is allowed.' }
      - name: Build portable bundle without shared artwork
        run: |
          $python = (Get-Command python).Source
          ./build-windows-portable.ps1 -Target $env:RELEASE_TARGET -PythonExecutable $python -BunExecutable (Get-Command bun).Source -ReuseInstalledDependencies
          if ($LASTEXITCODE -ne 0) { throw 'Native portable build failed.' }
      - name: Admit and relocate the exact emitted portable ZIP
        run: |
          @'
          import hashlib, json, os, re, shutil, stat, zipfile
          from pathlib import Path, PurePosixPath
          target = os.environ["RELEASE_TARGET"]
          archives = list(Path("dist").glob(f"Open-Clank-*-{target}.zip"))
          if len(archives) != 1:
              raise RuntimeError("Require one target-specific emitted ZIP")
          archive = archives[0]
          if not 0 < archive.stat().st_size < 2 * 1024 ** 3:
              raise RuntimeError("Portable ZIP asset size is outside the release bound")
          with archive.open("rb") as stream:
              archive_sha = hashlib.file_digest(stream, "sha256").hexdigest()
          checksum = Path(str(archive) + ".sha256").read_text().split()
          if len(checksum) != 2 or checksum[0] != archive_sha or checksum[1].lstrip("*") != archive.name:
              raise RuntimeError("Emitted ZIP checksum/name mismatch")
          destination = Path(os.environ["RUNNER_TEMP"]) / ("Qualified Portable " + target)
          original = Path("dist") / target / "openclank"
          if destination.exists() or not original.is_dir():
              raise RuntimeError("Require fresh relocation and current-job staged bundle")
          with zipfile.ZipFile(archive) as zipped:
              members = zipped.infolist()
              names = [item.filename for item in members]
              if len(names) != len(set(name.casefold() for name in names)):
                  raise RuntimeError("Portable ZIP duplicate/case-colliding members refused")
              for item in members:
                  path = PurePosixPath(item.filename)
                  mode = item.external_attr >> 16
                  if path.as_posix() != item.filename.rstrip("/") or path.is_absolute() or not path.parts or path.parts[0] != "openclank" or any(part in {"", ".", ".."} or part.endswith((".", " ")) or re.search(r'[\\:*?"<>|]', part) or re.fullmatch(r"(?i)(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(?:[.].*)?", part) for part in path.parts) or (mode and stat.S_IFMT(mode) not in {0, stat.S_IFREG, stat.S_IFDIR}):
                      raise RuntimeError("Portable ZIP path/type refused")
              total = sum(item.file_size for item in members)
              if total > 8 * 1024 ** 3 or shutil.disk_usage(destination.parent).free < total + 512 * 1024 ** 2:
                  raise RuntimeError("Insufficient bounded relocation disk space")
              destination.mkdir()
              zipped.extractall(destination)
          relocated = destination / "openclank"
          def inventory(root):
              result = {}
              for path in root.rglob("*"):
                  if path.is_symlink():
                      raise RuntimeError("Portable bundle symlink refused")
                  if path.is_file():
                      with path.open("rb") as stream:
                          result[path.relative_to(root).as_posix()] = hashlib.file_digest(stream, "sha256").hexdigest()
              return result
          original_inventory = inventory(original)
          relocated_inventory = inventory(relocated)
          if original_inventory != relocated_inventory:
              raise RuntimeError("Exact emitted/extracted bundle bytes disagree")
          Path("dist/portable-zip-" + target + ".json").write_text(json.dumps({"target": target, "zip_sha256": archive_sha, "files": len(relocated_inventory), "qualification": "exact-emitted-zip-relocation-admitted"}, indent=2) + "\n")
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("QUALIFIED_PORTABLE_BUNDLE=" + str(relocated) + "\n")
          # Exact byte inventory proves this current job's original staging is redundant.
          shutil.rmtree(original)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Exact emitted ZIP relocation failed closed.' }
      - name: Acquire and verify shared artwork for disposable qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $parts = Join-Path $env:RUNNER_TEMP 'emoji-parts'
          # Reuse the exact files admitted before the native build.
          $pack = Join-Path $env:RUNNER_TEMP 'emoji-assets.pack'
          python -B scripts/emoji_asset_bundle.py assemble --parts $parts --pack $pack
          if ($LASTEXITCODE -ne 0) { throw 'Shared artwork SHA/size/SQLite/catalog verification failed.' }
          Remove-Item $parts -Recurse -Force
          Add-Content -Path $env:GITHUB_ENV -Value "QUALIFICATION_EMOJI_PACK=$pack"
      - name: Qualify actual native packaged first run
        run: |
          python -B scripts/qualify_windows_portable.py --bundle $env:QUALIFIED_PORTABLE_BUNDLE --target $env:RELEASE_TARGET --output "dist/qualification-$env:RELEASE_TARGET"
          if ($LASTEXITCODE -ne 0) { throw 'Actual packaged startup/auth/Files/helper qualification failed.' }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'wdeps/receipt.json') "dist/qualification-$env:RELEASE_TARGET/native-dependencies.json"
      - name: Build per-user installer from the qualified bundle
        run: |
          python -B scripts/build_windows_installer.py --bundle $env:QUALIFIED_PORTABLE_BUNDLE --target $env:RELEASE_TARGET --output-root dist/installers --tool-root (Join-Path $env:RUNNER_TEMP 'winstaller-tools') --qualification-receipt "dist/qualification-$env:RELEASE_TARGET/receipt.json"
          if ($LASTEXITCODE -ne 0) { throw 'Per-user installer build failed.' }
      - name: Qualify actual installed startup and data-preserving uninstall
        run: |
          $installers = @(Get-ChildItem dist/installers -Filter "Open-Clank-*-$env:RELEASE_TARGET-Setup.exe")
          if ($installers.Count -ne 1) { throw 'Require exactly one target-specific installer.' }
          python -B scripts/qualify_windows_installer.py --installer $installers[0].FullName --target $env:RELEASE_TARGET --emoji-pack $env:QUALIFICATION_EMOJI_PACK --output "dist/installer-qualification-$env:RELEASE_TARGET"
          if ($LASTEXITCODE -ne 0) { throw 'Actual per-user install/startup/auth/Files/thumbnail/uninstall qualification failed.' }
      - name: Require bounded release assets
        run: |
          $zips = @(Get-ChildItem dist -Filter "Open-Clank-*-$env:RELEASE_TARGET.zip")
          if ($zips.Count -ne 1 -or $zips[0].Length -ge 2GB) { throw 'Require exactly one reviewed ZIP under the GitHub 2 GiB per-file limit.' }
          if (-not (Test-Path ($zips[0].FullName + '.sha256'))) { throw 'Release ZIP checksum file is missing.' }
          $installers = @(Get-ChildItem dist/installers -Filter "Open-Clank-*-$env:RELEASE_TARGET-Setup.exe")
          if ($installers.Count -ne 1 -or $installers[0].Length -ge 2GB) { throw 'Require exactly one installer under the GitHub 2 GiB per-file limit.' }
          if (-not (Test-Path ($installers[0].FullName + '.sha256'))) { throw 'Installer checksum file is missing.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Open-Clank-${{ matrix.target }}
          path: |
            dist/Open-Clank-*-${{ matrix.target }}.zip
            dist/Open-Clank-*-${{ matrix.target }}.zip.sha256
            dist/qualification-${{ matrix.target }}/
            dist/portable-zip-${{ matrix.target }}.json
            dist/installers/Open-Clank-*-${{ matrix.target }}-Setup.exe
            dist/installers/Open-Clank-*-${{ matrix.target }}-Setup.exe.sha256
            dist/installers/Open-Clank-*-${{ matrix.target }}-Setup.provenance.json
            dist/installer-qualification-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
