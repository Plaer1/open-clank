name: Exact per-producer Windows release pair and installer artwork

on:
  push:
    branches: [codex/beta1-windows-pair-artwork-20261008]

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-pair-artwork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artwork:
    if: github.ref == 'refs/heads/codex/beta1-windows-pair-artwork-20261008'
    name: pair-artwork-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            architecture: x64
          - target: windows-arm64
            runner: windows-11-arm
            architecture: arm64
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.16'
          architecture: ${{ matrix.architecture }}
      - name: Admit native target and reserve disposable pair and artwork space
        run: |
          @'
          import os, platform, shutil
          target = os.environ['RELEASE_TARGET']
          native = {'windows-x64': {'amd64', 'x86_64'}, 'windows-arm64': {'arm64', 'aarch64'}}
          if os.name != 'nt' or platform.machine().lower() not in native[target]:
              raise SystemExit('Matching native Windows Python is mandatory')
          if shutil.disk_usage(os.environ['RUNNER_TEMP']).free < 8 * 1024**3:
              raise SystemExit('Insufficient disposable space for exact producer proofs and both artwork installs')
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { throw 'Native target or disk admission failed.' }
      - name: Acquire existing pinned compact artwork parts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $parts = Join-Path $env:RUNNER_TEMP "pair-artwork-parts-$env:RELEASE_TARGET"
          if (Test-Path $parts) { throw 'Preserve existing artwork staging.' }
          gh release download v1.0.2-beta.1-artwork-compact --repo $env:GITHUB_REPOSITORY --pattern 'emoji-assets.parts.json' --pattern 'emoji-assets.pack.part-*' --dir $parts
          if ($LASTEXITCODE -ne 0) { throw 'Pinned public compact artwork download failed.' }
      - name: Admit both exact native producers and qualify installer artwork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $parts = Join-Path $env:RUNNER_TEMP "pair-artwork-parts-$env:RELEASE_TARGET"
          $privateLog = Join-Path $env:RUNNER_TEMP "pair-artwork-private-$env:RELEASE_TARGET.log"
          if (Test-Path $privateLog) { throw 'Preserve existing private qualification log.' }
          python -B scripts/verify_windows_release_pair.py --target $env:RELEASE_TARGET --output "dist/pair-admitted-$env:RELEASE_TARGET" --receipt "dist/pair-admission-$env:RELEASE_TARGET.json" --parts $parts --artwork-output "dist/pair-artwork-$env:RELEASE_TARGET" *> $privateLog
          if ($LASTEXITCODE -ne 0) {
            @'
          import json, re, sys
          from pathlib import Path
          prefix = 'SAFE_WINDOWS_PAIR_DIAGNOSTIC '
          stages = {'execution-source', 'producer-source', 'original-provenance', 'official-artifact', 'proof-and-members', 'native-receipts', 'export', 'artwork'}
          scripts = {'verify_windows_release_pair.py', 'verify_retained_windows_release.py', 'qualify_retained_windows_release.py', 'qualify_treehouse.py', 'qualify_theme_emoji.py', 'qualify_windows_installer_artwork.py', 'qualify_windows_installer.py'}
          marker_names = {'download-or-verification-error', 'artwork-working-space-error', 'release-part-missing', 'release-part-hash-error', 'payload-verification-error', 'artwork-assembly-error', 'existing-payload-collision'}
          booleans = ('log_present', 'log_tail_readable', 'payload_executable_present', 'uninstaller_present', 'installed_pack_present')
          try:
              with Path(sys.argv[1]).open('rb') as stream:
                  stream.seek(0, 2)
                  stream.seek(max(0, stream.tell() - 65536))
                  lines = stream.read(65536).decode('utf-8', errors='replace').splitlines()
              for line in lines:
                  if not line.startswith(prefix) or len(line) > 4096:
                      continue
                  record = json.loads(line[len(prefix):])
                  if set(record) != {'stage', 'exception_class', 'frames', 'subprocess_returncode', 'subprocess_kind', 'artwork_fixture'} or record['stage'] not in stages:
                      continue
                  if not isinstance(record['exception_class'], str) or not re.fullmatch(r'[A-Za-z_][A-Za-z0-9_]{0,127}', record['exception_class']):
                      continue
                  frames = record['frames']
                  if not isinstance(frames, list) or len(frames) > 32:
                      continue
                  if not all(isinstance(frame, dict) and set(frame) == {'script', 'line'} and frame['script'] in scripts and type(frame['line']) is int and frame['line'] > 0 for frame in frames):
                      continue
                  returncode = record['subprocess_returncode']
                  if returncode is not None and (type(returncode) is not int or not -(2**31) <= returncode < 2**32):
                      continue
                  if record['subprocess_kind'] not in {'none', 'other', 'setup', 'private-cli', 'uninstall'}:
                      continue
                  fixture = record['artwork_fixture']
                  if not isinstance(fixture, dict) or set(fixture) != {'mode', 'markers', *booleans}:
                      continue
                  if fixture['mode'] not in {'unavailable', 'default-download', 'existing-parts'} or not all(type(fixture[key]) is bool for key in booleans):
                      continue
                  markers = fixture['markers']
                  if not isinstance(markers, list) or len(markers) > len(marker_names) or not all(isinstance(marker, str) and marker in marker_names for marker in markers) or markers != sorted(set(markers)):
                      continue
                  safe_fixture = {'mode': fixture['mode'], 'markers': list(markers), **{key: fixture[key] for key in booleans}}
                  print(json.dumps({'stage': record['stage'], 'exception_class': record['exception_class'], 'frames': [{'script': frame['script'], 'line': frame['line']} for frame in frames], 'subprocess_returncode': returncode, 'subprocess_kind': record['subprocess_kind'], 'artwork_fixture': safe_fixture}, separators=(',', ':')))
                  break
          except Exception:
              pass
          '@ | python -B - $privateLog
            throw 'Exact producer pair or actual installer artwork qualification failed; raw diagnostics remain private.'
          }
          Write-Output 'Both exact native producer proofs and actual installer artwork journeys passed.'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Windows-release-pair-artwork-${{ matrix.target }}
          path: |
            dist/pair-admitted-${{ matrix.target }}/Open-Clank-1.0.2-${{ matrix.target }}.zip
            dist/pair-admitted-${{ matrix.target }}/Open-Clank-1.0.2-${{ matrix.target }}.zip.sha256
            dist/pair-admitted-${{ matrix.target }}/Open-Clank-1.0.2-${{ matrix.target }}-Setup.exe
            dist/pair-admitted-${{ matrix.target }}/Open-Clank-1.0.2-${{ matrix.target }}-Setup.exe.sha256
            dist/pair-admitted-${{ matrix.target }}/Open-Clank-1.0.2-${{ matrix.target }}-Setup.provenance.json
            dist/pair-admitted-${{ matrix.target }}/original-retention.json
            dist/pair-admitted-${{ matrix.target }}/original-relocation.json
            dist/pair-admitted-${{ matrix.target }}/portable-qualification.json
            dist/pair-admitted-${{ matrix.target }}/installed-qualification.json
            dist/pair-admitted-${{ matrix.target }}/installed-runtime-qualification.json
            dist/pair-admitted-${{ matrix.target }}/proof-chain.json
            dist/pair-admission-${{ matrix.target }}.json
            dist/pair-artwork-${{ matrix.target }}/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
