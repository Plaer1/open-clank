name: Beta release macOS build

on:
  push:
    branches: [codex/beta1-macos-release-build-20261006]
  workflow_dispatch:
    inputs:
      emoji_release_tag:
        description: Same-repository release containing the pinned offline artwork parts
        required: true
        default: v1.0.2-beta.1-artwork-compact
        type: string

permissions:
  contents: read

concurrency:
  group: beta-macos-release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: github.ref == 'refs/heads/codex/beta1-macos-release-build-20261006'
    runs-on: macos-15
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: '2'
      RUSTUP_TOOLCHAIN: 1.99.0-aarch64-apple-darwin
      EMOJI_RELEASE_TAG: ${{ inputs.emoji_release_tag || 'v1.0.2-beta.1-artwork-compact' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Require native Apple Silicon and shared asset access
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 15
          gh release view "$EMOJI_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null
          parts="$RUNNER_TEMP/emoji-parts"
          gh release download "$EMOJI_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'bundle-manifest.json' --pattern 'emoji-assets.parts.json' --pattern 'emoji-assets.pack.part-001' --dir "$parts"
          python3 -B - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "emoji-parts"
          sealed = Path("static/vendor/google-emoji/bundle-manifest.json").read_bytes()
          assert hashlib.sha256(sealed).hexdigest() == "03bfa768ea11381d9859464bd05f848f4709f848085537b10029abe9e64fd385"
          assert (root / "bundle-manifest.json").read_bytes() == sealed
          raw = (root / "emoji-assets.parts.json").read_bytes()
          assert hashlib.sha256(raw).hexdigest() == "f58411bc3aee12c7947ef27271f86cde9e4813df230c97d6394c1a715acdb2f9"
          parts, pin = json.loads(raw), json.loads(sealed)
          assert parts["pack_bytes"] == pin["pack_bytes"] and parts["pack_sha256"] == pin["pack_sha256"]
          assert len(parts["parts"]) == 1
          part = parts["parts"][0]
          assert part["filename"] == "emoji-assets.pack.part-001" and part["bytes"] == pin["pack_bytes"] and part["sha256"] == pin["pack_sha256"]
          payload = root / part["filename"]
          assert payload.stat().st_size == part["bytes"]
          digest = hashlib.sha256()
          with payload.open("rb") as stream:
              for block in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                  digest.update(block)
          assert digest.hexdigest() == part["sha256"]
          print("Compact artwork: exact three public files admitted against sealed source pins")
          PYTHON
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13.16'
          architecture: arm64
      - name: Require native build tools and exact Rust
        run: |
          set -euo pipefail
          python3 -I -c 'import platform; assert platform.machine() == "arm64"; assert platform.python_version() == "3.13.16"'
          xcrun --find clang >/dev/null
          for tool in swiftc sips iconutil lipo otool codesign hdiutil; do test -x "/usr/bin/$tool"; done
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV | grep -Fx 'release: 1.99.0'
          rustc -vV | grep -Fx 'host: aarch64-apple-darwin'
      - name: Build sealed native app and DMG without shared artwork
        run: |
          set -euo pipefail
          python3 -B scripts/macos_package.py build --output dist/macos-arm64
          mkdir -p dist/macos-provenance
          cp dist/macos-arm64/OpenClank.app/Contents/Resources/build-provenance.json dist/macos-provenance/
          cp dist/macos-arm64/OpenClank.app/Contents/Resources/package-manifest.json dist/macos-provenance/
          # Successful DMG and sealed app retain all package evidence. These are only this job's disposable build intermediates.
          rm -rf dist/macos-arm64/work dist/macos-arm64/engine
      - name: Record sealed unqualified build identity
        run: |
          set -euo pipefail
          python3 -B - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          paths = ["dist/macos-arm64/Open-Clank-1.0.2-macos-arm64.dmg", "dist/macos-arm64/Open-Clank-1.0.2-macos-arm64.dmg.sha256", "dist/macos-provenance/build-provenance.json", "dist/macos-provenance/package-manifest.json"]
          entries = []
          for name in paths:
              path = Path(name)
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              entries.append({"path": name, "bytes": path.stat().st_size, "sha256": digest})
          record = {"source_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "qualification": "unqualified-build-only", "files": entries}
          Path("dist/macos-provenance/build-identity.json").write_text(json.dumps(record, indent=2) + "\n")
          PYTHON
      - name: Retain sealed build evidence before private runtime qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Open-Clank-macos-arm64-build-unqualified
          path: |
            dist/macos-arm64/Open-Clank-1.0.2-macos-arm64.dmg
            dist/macos-arm64/Open-Clank-1.0.2-macos-arm64.dmg.sha256
            dist/macos-provenance/build-provenance.json
            dist/macos-provenance/package-manifest.json
            dist/macos-provenance/build-identity.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Verify external artwork for disposable qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          parts="$RUNNER_TEMP/emoji-parts"
          pack="$RUNNER_TEMP/emoji-assets.pack"
          # Reuse the exact files admitted before the native build.
          python3 -B scripts/emoji_asset_bundle.py assemble --parts "$parts" --pack "$pack"
          rm -rf "$parts"
          printf 'QUALIFICATION_EMOJI_PACK=%s\n' "$pack" >> "$GITHUB_ENV"
      - name: Qualify actual mounted and relocated package
        run: |
          set -euo pipefail
          python3 -B scripts/qualify_macos_package.py --dmg dist/macos-arm64/Open-Clank-1.0.2-macos-arm64.dmg --output dist/macos-qualification --emoji-pack "$QUALIFICATION_EMOJI_PACK"
          # AppKit GUI Quit and Screen Recording permission journeys require separate native manual evidence.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Open-Clank-macos-arm64
          path: |
            dist/macos-arm64/Open-Clank-1.0.2-macos-arm64.dmg
            dist/macos-arm64/Open-Clank-1.0.2-macos-arm64.dmg.sha256
            dist/macos-provenance/*.json
            dist/macos-qualification/receipt.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
