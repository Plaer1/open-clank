[package]
name = "openclank-history"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
chrono = { workspace = true }
bytes = "1.11.1"
base64 = "0.22.1"
blake3 = "1.8.2"
libc = "0.2"
sha2 = "0.10"
lore-storage = { path = "vendor/lore/lore-storage" }
redb = "2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "fs", "net", "io-util", "time"] }

[features]
test_faults = []
qualification-fixtures = ["test_faults", "lore-storage/test_faults"]

[dev-dependencies]
tempfile = "3.27.0"
lore-storage = { path = "vendor/lore/lore-storage", features = ["test_faults"] }

[[bin]]
name = "lore_fixture"
path = "src/bin/lore_fixture.rs"
required-features = ["qualification-fixtures"]

[[bin]]
name = "openclank-history-service"
path = "src/bin/openclank-history-service.rs"

[workspace]
resolver = "2"
members = [
    ".",
    "vendor/lore/lore-base",
    "vendor/lore/lore-credential",
    "vendor/lore/lore-error-set",
    "vendor/lore/lore-error-set-macro",
    "vendor/lore/lore-io",
    "vendor/lore/lore-macro",
    "vendor/lore/lore-proto",
    "vendor/lore/lore-storage",
    "vendor/lore/lore-telemetry",
    "vendor/lore/lore-transport",
]

[workspace.package]
version = "0.13.1-nightly"

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
# lore-server's telemetry reads cfg(tokio_unstable). Declared here because a crate cannot
# have its own lints table alongside `workspace = true`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# cargo = { level = "warn", priority = -1 } # TODO(raghav.narula) Enable after duplicate dependencies fixed
# undocumented_unsafe_blocks = "warn" # TODO(raghav.narula) enable in follow up
checked_conversions = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
doc_markdown = "warn"
empty_enums = "warn"
enum_glob_use = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
implicit_clone = "warn"
imprecise_flops = "warn"
inefficient_to_string = "warn"
invalid_upcast_comparisons = "warn"
large_digit_groups = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_continue = "warn"
needless_for_each = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
ptr_as_ptr = "warn"
rc_mutex = "warn"
ref_option_ref = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
string_add_assign = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
todo = "warn"
trait_duplication_in_bounds = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_async = "warn"
unused_self = "warn"
verbose_file_reads = "warn"
zero_sized_map_values = "warn"

[workspace.dependencies]
crossbeam-utils = "0.8.23"
hyper = { version = "1.9.0", default-features = false }
hyper-util = { version = "0.1.20", default-features = false }
lore = { path = "vendor/lore/lore" }
lore-aws = { path = "vendor/lore/lore-aws" }
lore-base = { path = "vendor/lore/lore-base" }
lore-credential = { path = "vendor/lore/lore-credential" }
lore-error-set = { path = "vendor/lore/lore-error-set" }
lore-error-set-macro = { path = "vendor/lore/lore-error-set-macro" }
lore-hashicorp = { path = "vendor/lore/lore-hashicorp" }
lore-integration-tests = { path = "vendor/lore/lore-integration-tests" }
lore-io = { path = "vendor/lore/lore-io" }
lore-macro = { path = "vendor/lore/lore-macro" }
lore-notification = { path = "vendor/lore/lore-notification" }
lore-proto = { path = "vendor/lore/lore-proto" }
lore-revision = { path = "vendor/lore/lore-revision" }
lore-server = { path = "vendor/lore/lore-server" }
lore-storage = { path = "vendor/lore/lore-storage" }
lore-telemetry = { path = "vendor/lore/lore-telemetry" }
lore-transport = { path = "vendor/lore/lore-transport" }
anstyle = "1.0.11"
anstream = "0.6.20"
anyhow = "1.0.103"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.4"
base64 = "0.22.1"
bitcode = "=0.6.9"
bitflags = "2.9.4"
blake3 = "1.8.2"
bytes = { version = "1.11.1", features = ["serde"] }
chrono = { version = "0.4.42", default-features = false, features = ["alloc", "clock"] }
clap = { version = "4.5.47", features = ["derive", "string", "unicode"] }
clap-markdown = "0.1.5"
config = { version = "0.15.15", features = ["toml"], default-features = false }
ctor = "0.2"
crossbeam = "0.8.4"
dashmap = "6.1.0"
diffy = "0.5.2"
directories = "6.0.0"
enum_dispatch = "0.3.13"
tracing-appender = "0.2.3"
tracing-ecs = "0.4.1"
tracing-opentelemetry = "0.32.0"
fastcdc = "3.2.1"
futures = "0.3.31"
glob-match = "0.2.1"
governor = "0.10.1"
hex = "0.4.3"
http = "1.3.1"
indexmap = "2.11.1"
infer = "0.19.0"
io-uring = "0.7"
jsonwebtoken = { version = "9.3.1", default-features = false }
# The OS secure stores the token store keeps its encryption keys in, one per platform.
keyring = { version = "3.6.3", features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }
libc = "0.2.175"
lz4-sys = "1.11"
zstd-sys = { version = "2.0", default-features = false, features = ["experimental"] }
mockall = "0.13.1"
opentelemetry = "0.31.0"
opentelemetry-otlp = { version = "0.31.0", features = ["grpc-tonic", "tls", "tls-roots"] }
opentelemetry_sdk = { version = "0.31.0", features = ["rt-tokio"] }
opentelemetry-semantic-conventions = { version = "0.31.0", features = ["semconv_experimental"] }
parking_lot = { version = "0.12.4", features = ["arc_lock"] }
pin-project = "1.1.10"
proc-macro2 = "1"
prost = "0.14.1"
prost-types = "0.14.1"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "bloom"] }
quinn-proto = { version = "=0.11.19", default-features = false }
quote = "1.0.40"
rand = "0.9.2"
regex = "1"
rcgen = "0.14.4"
reqwest = { version = "0.12.23", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "rustls-tls-native-roots",
    "charset",
    "http2",
    "macos-system-configuration",
] }
ring = "0.17.14"
# We configure rustls to not bring in aws-lc-sys, which seems to have build issues on Windows.
rustls = { version = "0.23.46", default-features = false, features = [
    "std",
    "logging",
    "ring",
] }
rustls-pki-types = "1.13.1"
rustls-native-certs = "0.8.2"
smallvec = { version = "1.15.1", features = ["union"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }
serde_bytes = "0.11.17"
serde_json = { version = "1.0.143", default-features = false }
serde_with = { version = "3.14.0", default-features = false, features = ["alloc", "macros"] }
serial_test = { version = "3.2.0" }
socket2 = "0.6.0"
syn = "2.0.106"
sysinfo = "0.37.0"
temp-env = "0.3.6"
thiserror = "2.0.16"
tokio = { version = "1.53.3", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "parking_lot",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-metrics = { version = "0.4.5", default-features = false, features = ["rt"] }
tokio-stream = { version = "0.1.17", default-features = false, features = ["sync"] }
tokio-util = { version = "0.7.16", default-features = false, features = ["rt"] }
toml = "0.9.5"
trybuild = "1"
tonic = { version = "0.14.2", default-features = false, features = ["codegen", "router", "server", "tls-native-roots", "tls-webpki-roots"] }
tonic-prost = "0.14.2"
tonic-prost-build = "0.14.2"
tower = { version = "0.5.2", default-features = false }
tower-http = { version = "0.6.11", default-features = false }
tracing = { version = "0.1.41", features = ["release_max_level_debug"] }
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
tracing-test = "0.2.5"
url = "2.5.7"
urlencoding = "2.1.3"
uuid = { version = "1.18.1", default-features = false, features = ["v4", "v7"] }
vergen = { version = "9.0.6", default-features = false, features = ["cargo", "rustc", "build", "si"] }
webpki-roots = "1.0.11"
windows-sys = "0.61.0"
x509-parser = "0.18.0"
xxhash-rust = { version = "0.8.15", default-features = false, features = ["xxh3"] }
zerocopy = { version = "0.8.26", features = [
    "derive",
    "alloc",
    "simd",
] }

# Note: we currently control debug symbol splitting in .cargo/config.toml

# Unoptimized builds, and the `test` profile that inherits from this one. Every
# test target links the whole workspace, so full DWARF is copied into each of
# them: it dominates link time, the size of the target directory and the
# linker's peak memory. Line tables keep file and line in a backtrace, which is
# what a failing test reports, and drop the type and variable information a
# debugger would use.

apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

crossbeam-epoch = "0.9.21"

crossbeam-queue = "0.3.14"

http-body = "1.0.1"

keyring-core = "1.0.1"

linux-keyutils-keyring-store = "1.0.0"

tempfile = "3.21"

windows-native-keyring-store = { version = "1.1.0", default-features = false }
[profile.dev]
debug = "line-tables-only"

# Fast build suitable for local development
[profile.release]
debug = "line-tables-only"
incremental = true
debug-assertions = true
panic = "abort"

# Faster to build than the `release` profile, for rapid iteration when debugging
[profile.iteration]
inherits = "release"
lto = "off"

# The actual release build
[profile.release-lto]
inherits = "release"
incremental = false
opt-level = 3
debug = 2
lto = "fat"
codegen-units = 4
debug-assertions = false

# Package overrides. Use this if you want to generate debug info or de-optimise a specific package
#[profile.release.package.lore-revision]
#debug = 2
#opt-level = 0

# Quinn sometimes debug asserts on something, silence it for now until we can investigate
[profile.release.package.quinn]
debug-assertions = false

[patch.crates-io]
quinn-proto = { path = "vendor/lore/vendor/quinn-proto" }
# Fixes a `**` backtracking defect that made the filter silently under-exclude;
# see vendor/glob-match/Cargo.toml.
glob-match = { path = "vendor/lore/vendor/glob-match" }
